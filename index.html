<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>绳动 RopeFit</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf6ff;background:#0e1726}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:20px 16px 100px}h1{font-size:26px;margin:10px 0}h2{font-size:19px;margin:0 0 15px}.muted{color:#9cb0c4}.card{background:#1b2b3c;border:1px solid #304154;border-radius:18px;padding:18px;margin:15px 0}.stat{font-size:38px;font-weight:800}.green{color:#62e0af}.bar{height:12px;background:#33485d;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#58d8a4;transition:width .2s}button,input,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #41586c}button{background:#52d5a0;color:#08271b;font-weight:700;cursor:pointer}button.secondary{background:#293d50;color:#f0f6ff}button:disabled{opacity:.5}input,select{background:#101e2d;color:white;min-width:0;width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.group button{padding:12px 2px;font-size:13px}.done{background:#2d7b68;color:white}nav{position:fixed;bottom:0;left:0;right:0;background:#142235;border-top:1px solid #33485d;display:flex;justify-content:center;padding:8px 5px max(8px,env(safe-area-inset-bottom))}nav button{flex:1;max-width:140px;background:none;color:#a6b9ca;border:0;font-size:13px}nav button.active{color:#61dfaf}section{display:none}section.active{display:block}label{display:block;color:#a6b9ca;font-size:13px;margin:10px 0 5px}svg.chart{width:100%;height:185px}small{color:#a6b9ca}ul{padding-left:20px}li{margin:9px 0}button.full{width:100%}
</style></head><body><main><header class="row"><div><small>ROPEFIT · 你的减脂记录</small><h1>绳动 🪢</h1></div><span class="green">● 本地保存</span></header>
<section id="home" class="active"><div class="card"><div class="row"><h2>今日跳绳</h2><span id="today"></span></div><div><span class="stat" id="count">0</span> <span class="muted" id="targetText">/ 500 下</span></div><div class="bar"><div id="progress" style="width:0"></div></div><p class="muted" id="groupHint"></p><div class="group" id="groups"></div><p class="row"><button id="add" class="full">+ 完成一组</button><button id="undo" class="secondary">撤销</button></p><small>训练前热身，膝盖、脚踝或跟腱疼痛时停止。</small></div><div class="grid"><div class="card"><small>最新体重</small><p class="stat" id="weightStat">70</p><small>目标 <span id="goalStat">65</span> kg</small></div><div class="card"><small>今日热量</small><p class="stat" id="calStat">0</p><small>目标 <span id="calGoalStat">1800</span> kcal</small></div></div></section>
<section id="plan"><div class="card"><h2>渐进训练计划</h2><p class="muted">根据恢复情况调整，不必强行按周升级。</p><div id="stages"></div><label>当前阶段</label><select id="stage"></select><label>每组跳绳数量</label><input id="perGroup" type="number" min="10" max="1000" step="10"><p><button id="savePlan" class="full">保存训练设置</button></p><small>建议初期每周 3 天训练，留出休息日。</small></div></section>
<section id="weight"><div class="card"><h2>体重变化</h2><svg class="chart" id="chart" viewBox="0 0 320 185" role="img" aria-label="体重变化趋势"></svg><p id="weightSummary" class="muted"></p><label>日期</label><input type="date" id="weightDate"><label>体重 (kg)</label><input type="number" id="weightInput" min="20" max="300" step=".1"><p><button class="full" id="saveWeight">保存体重</button></p><ul id="weightList"></ul></div></section>
<section id="food"><div class="card"><h2>每日热量记录</h2><p><span class="stat" id="foodTotal">0</span> / <span id="foodGoal">1800</span> kcal</p><label>食物名称</label><input id="foodName" placeholder="例如：午餐"><label>热量 (kcal)</label><input type="number" id="foodKcal" min="1" max="10000"><p><button class="full" id="addFood">添加记录</button></p><ul id="foodList"></ul><small>热量需根据食品标签或实际份量估算。</small></div></section>
<section id="settings"><div class="card"><h2>个人设置</h2><label>目标体重 (kg)</label><input id="goal" type="number" min="20" max="300" step=".1"><label>每日热量参考 (kcal)</label><input id="calGoal" type="number" min="1000" max="5000" step="50"><p><button class="full" id="saveSettings">保存设置</button></p></div><div class="card"><h2>备份与恢复</h2><p class="muted">数据仅保存在当前浏览器，清除网站数据可能丢失记录。建议定期备份。</p><button id="export" class="full">导出 JSON 备份</button><label>导入备份文件</label><input id="import" type="file" accept=".json,application/json"></div></section></main>
<nav><button data-tab="home" class="active">🏠<div>首页</div></button><button data-tab="plan">📅<div>计划</div></button><button data-tab="weight">📈<div>体重</div></button><button data-tab="food">🍽️<div>热量</div></button><button data-tab="settings">⚙️<div>设置</div></button></nav>
<script src="./app.js"></script></body></html>
